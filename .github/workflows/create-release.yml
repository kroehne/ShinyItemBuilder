name: Build and Release R Package

on:
  repository_dispatch:
    types: [create-release]

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: 
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
          needs: check

      - name: Extract Version from DESCRIPTION
        run: |
          VERSION=$(grep -E '^Version:' DESCRIPTION | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Extract Git Hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "HASH=$HASH" >> $GITHUB_ENV
        shell: bash

      - name: Build Package
        run: |
          Rscript -e "devtools::build(path = getwd())"

      - name: List Package Files (Debugging)
        run: |
          echo "Current Directory: $(pwd)"
          ls -lah

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R-package-${{ matrix.config.os }}
          path: "ShinyItemBuilder_${{ env.VERSION }}.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Downloaded Artifacts
        run: ls -lah artifacts

      - name: Publish GitHub Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ env.VERSION }}"
          prerelease: true
          title: "${{ env.VERSION }} (${{ env.HASH }})"
          files: |
            ${{ github.workspace }}/ShinyItemBuilder_${{ env.VERSION }}.tar.gz