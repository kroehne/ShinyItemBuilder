name: Build and Release R Package

on:
  repository_dispatch:
    types: [create-release]

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config: 
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
          needs: check

      - name: Build Package
        run: |
          Rscript -e "devtools::build(path = getwd())"

      - name: List Package Files (Debugging)
        run: |
          echo "Current Directory: $(pwd)"
          ls -lah

      - name: Store Build Artifact
        run: |
          if ls *.tar.gz 1> /dev/null 2>&1; then
            echo "Package built successfully, uploading artifact..."
          else
            echo "No package archive found! Check the build process."
            exit 1
          fi
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R-package-${{ matrix.config.os }}
          path: "*.tar.gz"